<text x="52" y="548" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700">Interpretation</text>
<text x="52" y="574" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">Time is useful for eligible objects because 24:50 software-sync windows exist, but time is not spatial</text>
<text x="52" y="592" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">location.</text>
<text x="52" y="614" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">Azimuth is present for normal and review-only rows, yet remains weak because it is legacy configured</text>
<text x="52" y="632" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">optical-x mapping plus bbox envelope.</text>
<text x="52" y="654" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">Range is the dominant weakness: every non-blocked row keeps broad_unknown_range_prior because runtime-safe</text>
<text x="52" y="672" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">per-object range geometry is absent.</text>
