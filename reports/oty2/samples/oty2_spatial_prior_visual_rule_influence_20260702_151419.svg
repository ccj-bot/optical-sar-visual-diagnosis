<text x="336" y="524" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">blocked</text>
<text x="336" y="546" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">time/context retained where</text>
<text x="336" y="564" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">available</text>
