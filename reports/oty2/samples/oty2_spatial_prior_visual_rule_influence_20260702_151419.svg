<text x="336" y="266" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">expanded azimuth</text>
<text x="336" y="284" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">broad range</text>
