<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="34" y="44" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="800">Rule influence: how objects are routed</text>
<text x="34" y="72" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#475569" font-weight="400">This diagram shows construction rules, not scoring or selection.</text>
