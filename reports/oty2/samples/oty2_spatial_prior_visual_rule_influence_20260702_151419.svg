<rect x="620" y="470" width="230" height="96" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="636" y="498" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700">Blocked</text>
