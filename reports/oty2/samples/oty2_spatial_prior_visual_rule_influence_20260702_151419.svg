<rect x="60" y="620" width="790" height="90" rx="7" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
<text x="76" y="648" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700">Why not block every uncertain object?</text>
<text x="76" y="674" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">Secondary, edge, partial, duplicate, and handoff states often still carry useful runtime context.</text>
<text x="76" y="692" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334155" font-weight="400">They expand or downgrade the prior instead of becoming truth claims.</text>
